<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Swing V3</title>
  <link rel="stylesheet" href="roadmap.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="timeline-wrapper">
    <div class="timeline">
      <div class="period-nav">
        <button class="nav-btn nav-left" id="btn-prev">&#8592;</button>
        <div class="period-label-wrap">
          <span class="period-label" id="period-label">2026 H1</span>
        </div>
        <button class="nav-btn nav-right" id="btn-next">&#8594;</button>
      </div>

      <div class="main-line">
        <div class="edge left"></div>
        <div class="edge right"></div>
      </div>

      <div id="fruit-container"></div>
    </div>
  </div>

  <div class="admin-trigger" id="admin-trigger">...</div>

  <div class="admin-modal" id="admin-modal">
    <div class="admin-panel">
      <div class="admin-header">
        <h2>프로젝트 관리</h2>
        <button class="close-btn" id="close-admin-btn">&times;</button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>프로젝트 목록 선택 (수정/삭제시)</label>
          <select id="admin-project-select">
            <option value="">-- 새로 추가하기 --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Period *</label>
          <select id="project-period">
            <option>2025 H1</option>
            <option>2025 H2</option>
            <option>2026 H1</option>
            <option>2026 H2</option>
            <option>2027 H1</option>
            <option>2027 H2</option>
          </select>
        </div>

        <div class="form-group">
          <label>Type *</label>
          <select id="project-type">
            <option value="">선택</option>
            <option value="type1">type1 (주업)</option>
            <option value="type2">type2 (부업)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date *</label>
          <input type="text" id="project-date" placeholder="2026.01">
        </div>

        <div class="form-group desc-group">
          <label>Description * (작성 시 입력한 줄바꿈이 그대로 반영됩니다)</label>
          <textarea id="project-desc" rows="3" placeholder="예: 거창군 지역활력타운&#10;다부리복합문화센터&#10;건립사업 설계공모"></textarea>
        </div>

        <div class="form-group">
          <label>Rank</label>
          <input type="text" id="project-rank" placeholder="랭크를 적으시오">
        </div>
      </div>

      <div class="button-row">
        <button id="add-project-btn">프로젝트 추가</button>
        <div class="edit-buttons">
          <button id="update-project-btn" class="update-btn">수정완료</button>
          <button id="delete-project-btn" class="delete-btn">삭제하기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="roadmap.js"></script>
</body>
</html>
