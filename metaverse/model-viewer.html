<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB Model Viewer</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111827;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      max-width: min(680px, calc(100vw - 32px));
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="status">Loading ./assets/models/Glocal_Jinju.glb...</div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
    const MODEL_ROOT = "./assets/models/";
    const MODEL_FILE = "Glocal_Jinju.glb";
    const canvas = document.getElementById("renderCanvas");
    const status = document.getElementById("status");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.62, 0.72, 0.86, 1);

    const camera = new BABYLON.ArcRotateCamera("viewerCamera", -Math.PI / 2, Math.PI / 3, 120, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.wheelPrecision = 20;
    camera.lowerRadiusLimit = 1;

    const light = new BABYLON.HemisphericLight("viewerLight", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.85;
    const sun = new BABYLON.DirectionalLight("viewerSun", new BABYLON.Vector3(-0.4, -0.9, 0.25), scene);
    sun.position = new BABYLON.Vector3(80, 120, -60);
    sun.intensity = 1.8;

    function geometryMeshes(meshes) {
      return meshes.filter((mesh) => typeof mesh.getTotalVertices === "function" && mesh.getTotalVertices() > 0);
    }

    function getBounds(meshes) {
      const min = new BABYLON.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
      const max = new BABYLON.Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);

      meshes.forEach((mesh) => {
        mesh.computeWorldMatrix(true);
        const box = mesh.getBoundingInfo().boundingBox;
        min.minimizeInPlace(box.minimumWorld);
        max.maximizeInPlace(box.maximumWorld);
      });

      const size = max.subtract(min);
      const center = min.add(size.scale(0.5));
      return { min, max, size, center };
    }

    BABYLON.SceneLoader.ImportMeshAsync("", MODEL_ROOT, `${MODEL_FILE}?v=${Date.now()}`, scene)
      .then((result) => {
        const meshes = geometryMeshes(result.meshes);
        const bounds = getBounds(meshes);
        const radius = Math.max(bounds.size.x, bounds.size.y, bounds.size.z) * 0.8;
        camera.target = bounds.center;
        camera.radius = Math.max(radius, 10);
        camera.upperRadiusLimit = camera.radius;
        status.textContent = `Loaded ${MODEL_FILE} / ${meshes.length} meshes / size x ${bounds.size.x.toFixed(2)}, y ${bounds.size.y.toFixed(2)}, z ${bounds.size.z.toFixed(2)} / center x ${bounds.center.x.toFixed(2)}, y ${bounds.center.y.toFixed(2)}, z ${bounds.center.z.toFixed(2)}`;
      })
      .catch((error) => {
        console.error(error);
        status.textContent = `Failed: ${error.message || error}`;
      });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
