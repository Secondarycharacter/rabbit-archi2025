<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Test Arena (Angji)</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #8eb4c8;
      font-family: "Segoe UI", sans-serif;
      color: #f4f7fb;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .test-hud {
      position: fixed;
      top: 12px;
      left: 12px;
      max-width: min(420px, calc(100vw - 24px));
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(12, 18, 28, 0.82);
      font-size: 13px;
      line-height: 1.45;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .test-hud strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .test-hud dl {
      margin: 8px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
    }

    .test-hud dt {
      opacity: 0.72;
    }

    .test-hud dd {
      margin: 0;
      word-break: break-word;
    }

    .test-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 12, 20, 0.55);
      text-align: center;
      padding: 24px;
    }

    .test-overlay.is-hidden {
      display: none;
    }

    .test-overlay__panel {
      max-width: 420px;
      padding: 24px 28px;
      border-radius: 14px;
      background: rgba(12, 18, 28, 0.92);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .test-overlay__panel h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .test-overlay__panel p {
      margin: 0 0 8px;
      opacity: 0.88;
      line-height: 1.5;
    }

    .test-overlay__panel button {
      margin-top: 16px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #4f8cff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" tabindex="0" aria-label="Character test arena"></canvas>

  <aside class="test-hud" aria-live="polite">
    <strong>Character Test (Angji physics)</strong>
    <div id="statusLine">Loading character…</div>
    <dl>
      <dt>Locomotion</dt><dd id="locomotionState">-</dd>
      <dt>Action</dt><dd id="activeAction">-</dd>
      <dt>Ground</dt><dd id="groundState">-</dd>
      <dt>Keys</dt><dd id="activeKeys">-</dd>
      <dt>Clips</dt><dd id="availableClips">-</dd>
    </dl>
  </aside>

  <div class="test-overlay" id="startOverlay">
    <div class="test-overlay__panel">
      <h1>캐릭터 테스트 아레나</h1>
      <p>앵지 투어와 동일한 중력·이동·점프 설정입니다.</p>
      <p>WASD 이동 · Shift 달리기 · Space 점프 · J 점프오버(테스트) · E 던지기 · P 댄스 · 마우스 시점 · 휠 줌</p>
      <button id="startButton" type="button">클릭하여 시작</button>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script type="module" src="./src/character-test.js?v=jump-over-fix22-tour-20260620"></script>
</body>
</html>
