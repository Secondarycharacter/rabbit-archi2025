<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>토끼 건축사사무소 워크패드 스튜디오</title>

<style>
@font-face {
  font-family: 'NanumSquareB';
  src: url('fonts/NanumSquareB.otf') format('opentype');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  background: #000;
  overflow: hidden;
  font-family: 'NanumSquareB', sans-serif;
  color: #fff;
}

.page-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.logo-wrapper {
  position: absolute;
  left: 50%;
  top: calc(50% - 25px);
  transform: translate(-50%, -100%);
}

.logo-frame {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 260px;
  border: 4px solid #fff;
  border-radius: 50%;
  overflow: hidden;
}

.logo-frame img {
  width: 100%;
  display: block;
}

.welcome-wrapper {
  position: absolute;
  left: 50%;
  top: calc(50% + 25px);
  transform: translateX(-50%);
}

.welcome-message {
  font-size: 18px;
  line-height: 1.5;
  text-align: center;
  opacity: 0;
  transition: opacity 1s ease;
}

.welcome-message.show {
  opacity: 1;
}

.bottom-area {
  position: absolute;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.uc-animation {
  opacity: 0;
  transition: opacity 0.5s ease;
}

.uc-animation.show {
  opacity: 1;
}

.uc-animation img {
  width: 160px;
}

.maintenance-message {
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.maintenance-message.show {
  opacity: 1;
}

@keyframes fadeBlink {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

.maintenance-message.fade {
  animation: fadeBlink 1.5s ease-in-out infinite;
}

/* TOP MENU */
.top-menu {
  position: absolute;
  top: 40px;
  right: 50px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  z-index: 100;
}

.roadmap-menu,
.metaverse-menu {
  color: #fff;
  font-size: 18px;
  letter-spacing: 2px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}

.roadmap-menu.show,
.metaverse-menu.show {
  opacity: 1;
  pointer-events: auto;
}

.visitor-counter {
  position: absolute;
  top: 40px;
  left: 50px;
  display: flex;
  gap: 18px;
  color: rgba(255, 255, 255, 0.82);
  font-size: 13px;
  letter-spacing: 1px;
  z-index: 100;
}

.visitor-counter span {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
}

.visitor-counter strong {
  color: #fff;
  font-size: 16px;
  font-weight: 700;
}

.roadmap-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease;
  z-index: 9999;
}

.roadmap-overlay.show {
  opacity: 1;
  visibility: visible;
}

.roadmap-overlay img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.roadmap-guide {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(30,145,20,0.85);
  animation: fadeBlink 1.5s ease-in-out infinite;
}

/* ── 태블릿 / 아이패드 대응 ── */
@media screen and (max-width: 1024px) {
  .logo-frame {
    max-width: 200px;
  }

  .welcome-message {
    font-size: 15px;
    white-space: normal;
    max-width: 90vw;
    padding: 0 20px;
  }

  .top-menu {
    top: 24px;
    right: 30px;
  }

  .roadmap-menu,
  .metaverse-menu {
    font-size: 16px;
  }

  .visitor-counter {
    top: 24px;
    left: 30px;
    font-size: 12px;
    gap: 12px;
  }

  .visitor-counter strong {
    font-size: 14px;
  }

  .uc-animation img {
    width: 120px;
  }

  .maintenance-message {
    font-size: 14px;
  }
}

/* ── 스마트폰 가로 모드 ── */
@media screen and (max-height: 500px) and (orientation: landscape) {
  .logo-frame {
    max-width: 100px;
  }

  .logo-wrapper {
    top: calc(50% - 10px);
  }

  .welcome-message {
    font-size: 12px;
    white-space: normal;
    max-width: 80vw;
  }

  .top-menu {
    top: 12px;
    right: 16px;
    gap: 8px;
  }

  .roadmap-menu,
  .metaverse-menu {
    font-size: 14px;
  }

  .visitor-counter {
    top: 12px;
    left: 16px;
    font-size: 10px;
    gap: 8px;
  }

  .visitor-counter strong {
    font-size: 12px;
  }

  .uc-animation img {
    width: 80px;
  }

  .maintenance-message {
    font-size: 12px;
  }

  .bottom-area {
    bottom: 10px;
    gap: 8px;
  }
}

/* ── 스마트폰 세로 모드: 가로 전환 안내 ── */
@media screen and (max-width: 500px) and (orientation: portrait) {
  body::after {
    content: '↻  화면을 가로로 돌려주세요';
    position: fixed;
    inset: 0;
    background: #000;
    color: #fff;
    font-family: 'NanumSquareB', sans-serif;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
  }
}
</style>
</head>

<body>

<div class="page-container">

  <div class="visitor-counter" id="visitorCounter" aria-live="polite">
    <span>누적 <strong id="totalVisitorCount">--</strong></span>
    <span>오늘 <strong id="todayVisitorCount">--</strong></span>
  </div>

  <div class="logo-wrapper">
    <div class="logo-frame">
      <img src="images/CI/01 CI_index.png" alt="CI">
    </div>
  </div>

  <div class="welcome-wrapper">
    <div class="welcome-message" id="welcomeMessage"></div>
  </div>

  <div class="bottom-area">
    <div class="uc-animation" id="ucAnimation">
      <img src="images/UC/ps1.png" alt="animation" id="ucAnimationImage">
    </div>

    <div class="maintenance-message" id="maintenanceMessage">
      토끼굴을 정비하고 있습니다.
    </div>
  </div>

  <div class="top-menu">
    <div class="roadmap-menu" id="roadmapMenu">HISTORY</div>
    <div class="metaverse-menu" id="metaverseMenu">METAVERSE</div>
  </div>

</div>



<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMQkGSc2RwKjAe7h5EcvWWdoJbS5_JjWs",
  authDomain: "rabbit-archi2025-c40a6.firebaseapp.com",
  projectId: "rabbit-archi2025-c40a6",
  storageBucket: "rabbit-archi2025-c40a6.firebasestorage.app",
  messagingSenderId: "577448559589",
  appId: "1:577448559589:web:5b984b45bff89303dd650c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const VISIT_STATS_COLLECTION = 'siteStats';
const VISIT_STATS_DOC = 'visits';
const TOTAL_VISIT_COUNTED_KEY = 'rabbitTotalVisitCounted';
const DAILY_VISIT_COUNTED_PREFIX = 'rabbitDailyVisitCounted:';

const welcomeMessage = document.getElementById('welcomeMessage');
const maintenanceMessage = document.getElementById('maintenanceMessage');
const ucAnimationContainer = document.getElementById('ucAnimation');
const ucAnimationImage = document.getElementById('ucAnimationImage');
const roadmapMenu = document.getElementById('roadmapMenu');
const metaverseMenu = document.getElementById('metaverseMenu');
const totalVisitorCount = document.getElementById('totalVisitorCount');
const todayVisitorCount = document.getElementById('todayVisitorCount');

const welcomeText =
'토끼건축사사무소는 공간의 울림과 사람의 이야기에 귀 기울이고,<br>공간의 본질을 탐구하며, 새로운 도약을 꿈꾸는 건축사사무소입니다.';

const animationFrames =
Array.from({ length: 15 }, (_, idx) => `images/UC/ps${idx + 1}.png`);

const tailFrames = animationFrames.slice(13);

const frameDuration = 100;
const tailLoopDuration = 5000;

let animationStarted = false;

function preloadFrames(frames) {
  frames.forEach((src) => {
    const img = new Image();
    img.src = src;
  });
}

function playFullSequence(callback) {
  let index = 0;
  function nextFrame() {
    ucAnimationImage.src = animationFrames[index];
    index += 1;
    if (index < animationFrames.length) {
      setTimeout(nextFrame, frameDuration);
    } else if (typeof callback === 'function') {
      callback();
    }
  }
  nextFrame();
}

function playTailLoop() {
  const startTime = performance.now();
  let index = 0;
  function nextTailFrame() {
    ucAnimationImage.src = tailFrames[index % tailFrames.length];
    index += 1;
    if (performance.now() - startTime < tailLoopDuration) {
      setTimeout(nextTailFrame, frameDuration);
    } else {
      playFullSequence(playTailLoop);
    }
  }
  nextTailFrame();
}

function startUcAnimation() {
  if (animationStarted) return;
  animationStarted = true;
  ucAnimationContainer.classList.add('show');
  preloadFrames(animationFrames);
  playFullSequence(playTailLoop);
}

function showWelcomeSequence() {
  welcomeMessage.innerHTML = welcomeText;
  welcomeMessage.classList.add('show');

  setTimeout(() => {
    maintenanceMessage.classList.add('show', 'fade');
    startUcAnimation();
    setTimeout(() => {
      roadmapMenu.classList.add('show');
      metaverseMenu.classList.add('show');
    }, 2000);
  }, 1500);
}

function getKstDateKey(date = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Seoul',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(date);

  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

function formatVisitorCount(value) {
  const count = Number(value);
  return Number.isFinite(count) ? count.toLocaleString('ko-KR') : '--';
}

function safeGetStorage(key) {
  try {
    return window.localStorage.getItem(key);
  } catch (error) {
    return null;
  }
}

function safeSetStorage(key, value) {
  try {
    window.localStorage.setItem(key, value);
  } catch (error) {
    console.warn('방문자 카운트 저장소 접근 실패:', error);
  }
}

function renderVisitorCounts(data, todayKey) {
  totalVisitorCount.textContent = formatVisitorCount(data?.totalVisitors ?? 0);
  todayVisitorCount.textContent = formatVisitorCount(data?.dailyVisitors?.[todayKey] ?? 0);
}

async function updateVisitorCounter() {
  const todayKey = getKstDateKey();
  const todayStorageKey = `${DAILY_VISIT_COUNTED_PREFIX}${todayKey}`;
  const shouldCountTotal = safeGetStorage(TOTAL_VISIT_COUNTED_KEY) !== 'true';
  const shouldCountToday = safeGetStorage(todayStorageKey) !== 'true';
  const statsRef = doc(db, VISIT_STATS_COLLECTION, VISIT_STATS_DOC);

  try {
    if (shouldCountTotal || shouldCountToday) {
      const updates = {
        lastVisitedAt: serverTimestamp()
      };

      if (shouldCountTotal) {
        updates.totalVisitors = increment(1);
      }

      if (shouldCountToday) {
        updates.dailyVisitors = {
          [todayKey]: increment(1)
        };
      }

      await setDoc(statsRef, updates, { merge: true });

      if (shouldCountTotal) {
        safeSetStorage(TOTAL_VISIT_COUNTED_KEY, 'true');
      }
      if (shouldCountToday) {
        safeSetStorage(todayStorageKey, 'true');
      }
    }

    const snapshot = await getDoc(statsRef);
    renderVisitorCounts(snapshot.exists() ? snapshot.data() : {}, todayKey);
  } catch (error) {
    console.error('방문자 카운트 업데이트 실패:', error);
    renderVisitorCounts({}, todayKey);
  }
}

// GitHub Pages 구조: index.html(루트) → history/history.html
roadmapMenu.addEventListener('click', () => {
  window.location.href = 'history/history.html';
});

metaverseMenu.addEventListener('click', () => {
  window.location.href = 'metaverse/index.html?project=angji';
});

window.addEventListener('DOMContentLoaded', () => {
  console.log('인덱스 페이지 로드 완료');
  updateVisitorCounter();
  showWelcomeSequence();
});

</script>

</body>
</html>
