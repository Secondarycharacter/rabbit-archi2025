<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>토끼 건축사사무소 워크패드 스튜디오</title>
<link rel="stylesheet" href="css/homepage-shell.css?v=type-scale-local-20260912">
<link rel="stylesheet" href="chat/css/metaverse-chat.css?v=type-scale-local-20260912">
</head>
<body class="homepage-shell">

<div class="shell-layout" id="shellLayout">
  <aside class="h1-panel" id="h1Panel" aria-label="프로젝트 목록">
    <div class="h1-visitor" id="visitorCounter" aria-live="polite">
      <div>VISITOR</div>
      <div>누적 <strong id="totalVisitorCount">--</strong></div>
      <div>오늘 <strong id="todayVisitorCount">--</strong></div>
    </div>
    <div class="h1-list-shell">
      <div class="h1-list-viewport-wrap">
        <div class="h1-list-viewport" id="h1ListViewport">
          <div class="h1-list-track" id="h1ListTrack"></div>
        </div>
        <div class="h1-scrollbar" id="h1Scrollbar" aria-hidden="true">
          <div class="h1-scrollbar-thumb" id="h1ScrollbarThumb"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="h0-panel" id="h0Panel" aria-label="메인 콘텐츠">
    <div class="h0-stage" id="h0Stage">
      <section class="h0-view h0-home is-active" id="h0ViewHome">
        <div class="h0-home-logo-wrapper">
          <div class="h0-home-logo-frame">
            <img src="images/CI/01 CI_index.png" alt="토끼건축사사무소 CI">
          </div>
        </div>
        <div class="h0-home-welcome-wrapper">
          <div class="h0-home-welcome" id="welcomeMessage"></div>
        </div>
        <div class="h0-home-bottom-area">
          <div class="h0-home-uc" id="ucAnimation">
            <img src="images/UC/ps1.png" alt="animation" id="ucAnimationImage">
          </div>
          <div class="h0-home-maintenance" id="maintenanceMessage">토끼굴을 정비하고 있습니다.</div>
        </div>
      </section>

      <section class="h0-view" id="h0ViewHistory">
        <iframe class="h0-iframe" id="historyFrame" title="HISTORY" loading="lazy"></iframe>
      </section>

      <section class="h0-view" id="h0ViewHistoryLink">
        <iframe class="h0-link-frame" id="historyLinkFrame" title="HISTORY Link Content" loading="lazy"></iframe>
      </section>

      <section class="h0-view" id="h0ViewMetaversePreview">
        <div class="h0-metaverse-layout">
          <div class="h0-metaverse-gallery" id="metaverseGallery" aria-label="메타버스 프로젝트">
            <div class="h0-metaverse-gallery-viewport" id="metaverseGalleryViewport">
              <div class="h0-metaverse-gallery-track" id="metaverseGalleryTrack"></div>
            </div>
            <button
              type="button"
              class="h0-metaverse-gallery-arrow"
              id="metaverseGalleryArrow"
              hidden
              aria-label="아래 프로젝트 보기"
            >↓</button>
          </div>
          <aside class="h0-split-chat h0-metaverse-chat" id="metaverseChat" aria-label="채팅">
            <h3 class="h0-split-chat__title">CHAT</h3>
            <div class="h0-split-chat__panel" id="metaverseChatPanel">
              <div class="metaverse-chat__messages" id="metaverseChatMessages" role="log" aria-live="polite"></div>
              <form class="metaverse-chat__composer" id="metaverseChatForm">
                <input
                  type="text"
                  class="metaverse-chat__nickname"
                  id="metaverseChatNickname"
                  maxlength="16"
                  placeholder="여기에 아이디를 입력해주세요"
                  autocomplete="nickname"
                >
                <input
                  type="text"
                  class="metaverse-chat__pin"
                  id="metaverseChatPin"
                  maxlength="6"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  placeholder="비번은 숫자6자 내용수정,삭제시 필요합니다"
                  autocomplete="off"
                >
                <div class="metaverse-chat__session" id="metaverseChatSession" hidden>
                  <span class="metaverse-chat__session-label" id="metaverseChatSessionLabel"></span>
                  <button type="button" class="metaverse-chat__logout" id="metaverseChatLogout">로그아웃</button>
                </div>
                <div class="metaverse-chat__input-row">
                  <textarea
                    class="metaverse-chat__input"
                    id="metaverseChatInput"
                    maxlength="500"
                    rows="2"
                    placeholder="메시지 입력 (Shift+Enter 줄바꿈)"
                    autocomplete="off"
                  ></textarea>
                  <button type="submit" class="metaverse-chat__send" aria-label="전송">↑</button>
                </div>
              </form>
            </div>
          </aside>
        </div>
      </section>

      <section class="h0-view" id="h0ViewMetaverseLoading">
        <div class="h0-loading">
          <div class="h0-loading-text">LOADING</div>
          <div class="h0-loading-bar"><span></span></div>
        </div>
      </section>

      <section class="h0-view" id="h0ViewMetaverse">
        <iframe class="h0-iframe" id="metaverseFrame" title="METAVERSE" allow="fullscreen"></iframe>
      </section>

      <section class="h0-view" id="h0ViewExtra">
        <div class="h0-extra-layout" id="extraLayout">
          <div class="h0-extra-gallery" id="extraGallery" aria-label="EXTRA 프로젝트">
            <div class="h0-extra-gallery-viewport" id="extraGalleryViewport">
              <div class="h0-extra-gallery-track" id="extraGalleryTrack"></div>
            </div>
            <button
              type="button"
              class="h0-extra-gallery-arrow"
              id="extraGalleryArrow"
              hidden
              aria-label="아래 프로젝트 보기"
            >↓</button>
          </div>
          <aside class="h0-split-chat h0-extra-chat" id="extraChat" aria-label="채팅">
            <h3 class="h0-split-chat__title">CHAT</h3>
            <div class="h0-split-chat__panel" id="extraChatPanel">
              <div class="metaverse-chat__messages" id="extraChatMessages" role="log" aria-live="polite"></div>
              <form class="metaverse-chat__composer" id="extraChatForm">
                <input
                  type="text"
                  class="metaverse-chat__nickname"
                  id="extraChatNickname"
                  maxlength="16"
                  placeholder="여기에 아이디를 입력해주세요"
                  autocomplete="nickname"
                >
                <input
                  type="text"
                  class="metaverse-chat__pin"
                  id="extraChatPin"
                  maxlength="6"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  placeholder="비번은 숫자6자 내용수정,삭제시 필요합니다"
                  autocomplete="off"
                >
                <div class="metaverse-chat__session" id="extraChatSession" hidden>
                  <span class="metaverse-chat__session-label" id="extraChatSessionLabel"></span>
                  <button type="button" class="metaverse-chat__logout" id="extraChatLogout">로그아웃</button>
                </div>
                <div class="metaverse-chat__input-row">
                  <textarea
                    class="metaverse-chat__input"
                    id="extraChatInput"
                    maxlength="500"
                    rows="2"
                    placeholder="메시지 입력 (Shift+Enter 줄바꿈)"
                    autocomplete="off"
                  ></textarea>
                  <button type="submit" class="metaverse-chat__send" aria-label="전송">↑</button>
                </div>
              </form>
            </div>
          </aside>
        </div>
      </section>
    </div>
  </main>

  <aside class="h2-panel" id="h2Panel" aria-label="상위 메뉴">
    <nav class="h2-menu" id="h2Menu">
      <button type="button" class="h2-menu-item" data-category="home">HOME</button>
      <button type="button" class="h2-menu-item" data-category="history">HISTORY</button>
      <button type="button" class="h2-menu-item h2-menu-item--metaverse" data-category="metaverse"><span class="h2-menu-item-label"><span class="beta">BETA</span>METAVERSE</span></button>
      <button type="button" class="h2-menu-item" data-category="extra">EXTRA</button>
    </nav>
    <button type="button" class="h2-admin-trigger" id="h2AdminTrigger" hidden aria-label="관리자 모드">...</button>
  </aside>
</div>

<script type="module" src="js/homepage-shell.js?v=type-scale-local-20260912"></script>
<script type="module" src="chat/js/metaverse-chat.js?v=extra-chat-lobby-20260912"></script>

</body>
</html>
