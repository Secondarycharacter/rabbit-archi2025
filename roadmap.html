<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROADMAP</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:opacity 0.2s ease;
}

.roadmap-container{
  position:relative;
  width:100vw;
  height:100vh;
}

.roadmap-container img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.guide-message{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  color: rgba(17, 100, 10, 0.85);
  font-size:12px;
  letter-spacing:1px;
  animation:blink 1.5s ease-in-out infinite;
}

@keyframes blink{
  0%,100%{opacity:0;}
  50%{opacity:1;}
}

</style>
</head>

<body>

<div class="roadmap-container">

<img src="images/roadmap/roadmap.png" alt="ROADMAP">

<div class="guide-message">
ESC를 누르면 초기화면으로 돌아갑니다.
</div>

</div>

<script>

window.addEventListener('keydown',(event)=>{

  if(event.key === 'Escape'){

    document.body.style.opacity = '0';

    setTimeout(()=>{
      window.location.href='index.html';
    },200);

  }

});

</script>

</body>
</html>
